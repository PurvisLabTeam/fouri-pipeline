[project]
name = "4i-pipeline"
version = "0.1.0"
requires-python = "==3.12.*"
description = "Purvis lab 4i image-analysis pipeline"
dependencies = [
    "affinder>=0.5.0",
    "anndata>=0.12.19",
    "cellpose>=4.2.1.1",
    "dask>=2026.8.0",
    "delve-fs",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "magicgui>=0.10.2",
    "matplotlib>=3.11.2",
    "napari[pyqt6]>=0.9.2",
    "nd2>=0.12.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "phate>=2.0.0",
    "plotly>=7.1.0",
    "psutil>=7.2.2",
    "pystackreg>=0.2.8",
    "python-pptx>=1.0.2",
    "scanpy>=1.11.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.5.2",
    "scipy>=1.17.1",
    "scprep>=1.1.0",
    "seaborn>=0.13.2",
    "sketchkh>=0.1.4",
    "statsmodels>=0.15.0",
    "threadpoolctl>=3.7.0",
    "tifffile>=2026.10.15",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "nbstripout>=0.8",
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
    "types-psutil>=7.2.2.20260906",
    "types-tqdm>=4.70.0.20261102",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fouri"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
delve-fs = { git = "https://github.com/omar-merhebi/delve", rev = "v0.1.7+purvislab.1" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
# The rule families foursight uses.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "D", "C4"]
extend-select = ["W505"]
# A docstring is optional (module, package, class, function, method), but one that exists is checked.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import in a cell after the CONFIG cell, by design.
"*.ipynb" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/fouri"]

[[tool.mypy.overrides]]
# These ship no type information and have no stub package.
module = [
    "pystackreg", "pystackreg.*", "cellpose", "cellpose.*", "ipywidgets", "ipywidgets.*", "napari", "napari.*",
    "plotly", "plotly.*", "sketchKH", "sketchKH.*", "delve", "delve.*", "phate", "phate.*", "umap", "umap.*",
    "threadpoolctl", "threadpoolctl.*",
]
ignore_missing_imports = true
