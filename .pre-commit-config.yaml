default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --no-sync ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: unsupported
        types_or: [python, pyi]
        files: ^(src|tests)/
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: unsupported
        types_or: [python, pyi]
        files: ^src/
        pass_filenames: false
      - id: quick-tests
        name: quick tests
        entry: uv run --no-sync pytest -m "not slow and not gpu"
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
